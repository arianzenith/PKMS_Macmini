<html lang="ko">
<head>
<meta charset="UTF-8">

<style>
/* ── Reset ── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:          #080d1a;
  --surface:     #0f1628;
  --surface2:    #162035;
  --gold:        #c8a96e;
  --gold-light:  #e5c99a;
  --gold-dim:    rgba(200,169,110,0.12);
  --gold-border: rgba(200,169,110,0.25);
  --white:       #eef2ff;
  --muted:       rgba(238,242,255,0.55);
  --dimmer:      rgba(238,242,255,0.22);
  --blue:        #4f8fff;
  --red:         #ff6b6b;
  --radius:      14px;
}

html, body {
  width: 100%; height: 100%;
  background: var(--bg);
  color: var(--white);
  font-family: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo',
               'Noto Sans KR', 'Pretendard', sans-serif;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}

/* ── Ambient background ── */
body::before {
  content: '';
  position: fixed; inset: 0;
  background:
    radial-gradient(ellipse 60% 50% at 80% 10%, rgba(79,143,255,0.06) 0%, transparent 60%),
    radial-gradient(ellipse 50% 40% at 10% 90%, rgba(200,169,110,0.07) 0%, transparent 60%);
  pointer-events: none; z-index: 0;
}

body::after {
  content: '';
  position: fixed; inset: 0;
  background-image:
    linear-gradient(rgba(200,169,110,0.025) 1px, transparent 1px),
    linear-gradient(90deg, rgba(200,169,110,0.025) 1px, transparent 1px);
  background-size: 72px 72px;
  pointer-events: none; z-index: 0;
}

/* ── Progress bar ── */
#progress {
  position: fixed; top: 0; left: 0; height: 2px;
  background: linear-gradient(90deg, var(--gold), var(--gold-light));
  transition: width .45s cubic-bezier(.4,0,.2,1);
  z-index: 200;
}

/* ── Slide counter ── */
#counter {
  position: fixed; top: 22px; right: 36px;
  font-size: 11px; font-weight: 500;
  color: var(--dimmer); letter-spacing: 2.5px;
  z-index: 200;
}

/* ── Navigation arrows ── */
.nav-btn {
  position: fixed; top: 50%; transform: translateY(-50%);
  width: 46px; height: 46px; border-radius: 50%;
  background: rgba(15,22,40,0.7); backdrop-filter: blur(8px);
  border: 1px solid var(--gold-border);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; color: var(--muted);
  transition: background .2s, border-color .2s, color .2s;
  z-index: 200;
}
.nav-btn:hover { background: var(--gold-dim); border-color: var(--gold); color: var(--gold); }
#nav-prev { left: 22px; }
#nav-next { right: 22px; }

/* ── Dots ── */
#dots {
  position: fixed; bottom: 26px; left: 50%; transform: translateX(-50%);
  display: flex; gap: 9px; z-index: 200;
}
.dot {
  width: 6px; height: 6px; border-radius: 3px;
  background: var(--dimmer); cursor: pointer;
  transition: background .3s, width .3s;
}
.dot.on { background: var(--gold); width: 22px; }

/* ── Deck & Slides ── */
#deck { position: relative; width: 100vw; height: 100vh; overflow: hidden; z-index: 1; }

.slide {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  padding: 56px 88px 72px;
  opacity: 0; pointer-events: none;
  transition: opacity .45s cubic-bezier(.4,0,.2,1), transform .45s cubic-bezier(.4,0,.2,1);
}
.slide.active { opacity: 1; pointer-events: all; transform: translateX(0) !important; }

/* ── Shared components ── */
.badge {
  display: inline-block;
  padding: 4px 13px; border-radius: 100px;
  border: 1px solid var(--gold); color: var(--gold);
  font-size: 10px; font-weight: 700; letter-spacing: 2.5px;
  text-transform: uppercase; margin-bottom: 18px;
}

.slide-title {
  font-size: clamp(26px, 3.4vw, 50px);
  font-weight: 700; line-height: 1.18;
  color: var(--white); margin-bottom: 10px;
}

.slide-sub {
  font-size: clamp(13px, 1.6vw, 20px);
  color: var(--gold-light); font-weight: 400; margin-bottom: 6px;
}

.divider {
  width: 44px; height: 2px;
  background: linear-gradient(90deg, var(--gold), transparent);
  margin: 18px 0;
}

.slide-desc {
  font-size: 14px; color: var(--muted); line-height: 1.85;
}

.wide { width: 100%; max-width: 1180px; }

/* ══════════════════ SLIDE LAYOUTS ══════════════════ */

/* ── COVER ── */
.cover-grid {
  display: grid; grid-template-columns: 1fr 1.1fr;
  gap: 72px; align-items: center;
  width: 100%; max-width: 1100px;
}
.icon-hero {
  display: flex; align-items: center; justify-content: center;
}
.hero-circle {
  width: 240px; height: 240px; border-radius: 50%;
  background: radial-gradient(circle at 38% 34%, var(--surface2) 0%, var(--surface) 100%);
  border: 1px solid var(--gold-border);
  box-shadow: 0 0 100px rgba(200,169,110,0.1), inset 0 1px 0 rgba(255,255,255,0.04);
  display: flex; align-items: center; justify-content: center;
  color: var(--gold); animation: pulse-glow 4s ease-in-out infinite;
}
@keyframes pulse-glow {
  0%,100% { box-shadow: 0 0 80px rgba(200,169,110,0.08); }
  50%      { box-shadow: 0 0 120px rgba(200,169,110,0.18); }
}
.cover-author {
  margin-top: 30px; font-size: 12px; color: var(--dimmer); letter-spacing: 1.5px;
}

/* ── THREE CARDS ── */
.three-col {
  display: grid; grid-template-columns: repeat(3, 1fr);
  gap: 18px; margin-top: 10px;
}
.card {
  background: var(--surface); border: 1px solid rgba(200,169,110,0.15);
  border-radius: var(--radius); padding: 26px 22px;
  transition: border-color .2s, transform .2s;
}
.card:hover { border-color: var(--gold); transform: translateY(-2px); }
.card-icon {
  width: 44px; height: 44px; border-radius: 10px;
  background: var(--gold-dim); color: var(--gold);
  display: flex; align-items: center; justify-content: center;
  margin-bottom: 16px;
}
.card-title { font-size: 15px; font-weight: 600; margin-bottom: 8px; }
.card-desc  { font-size: 13px; color: var(--muted); line-height: 1.72; }

/* ── PIPELINE ── */
.pipeline {
  display: flex; align-items: stretch; gap: 0; margin-top: 14px;
}
.pipe-step {
  flex: 1; background: var(--surface);
  border: 1px solid rgba(200,169,110,0.15); border-radius: var(--radius);
  padding: 28px 20px; text-align: center;
}
.pipe-arrow {
  flex-shrink: 0; width: 36px;
  display: flex; align-items: center; justify-content: center;
  color: var(--gold); font-size: 18px; opacity: .7;
}
.pipe-num {
  font-size: 10px; font-weight: 700; color: var(--gold);
  letter-spacing: 2.5px; margin-bottom: 14px;
}
.pipe-icon {
  width: 50px; height: 50px; border-radius: 12px;
  background: var(--gold-dim); color: var(--gold);
  display: flex; align-items: center; justify-content: center;
  margin: 0 auto 14px;
}
.pipe-title { font-size: 16px; font-weight: 600; margin-bottom: 8px; }
.pipe-desc  { font-size: 12px; color: var(--muted); line-height: 1.65; white-space: pre-line; }

/* ── DIALECTIC ── */
.dialectic {
  display: grid; grid-template-columns: repeat(3, 1fr);
  gap: 18px; margin-top: 10px;
}
.dial-card {
  background: var(--surface); border: 1px solid rgba(200,169,110,0.15);
  border-radius: var(--radius); padding: 26px 20px; position: relative; overflow: hidden;
}
.dial-card::after {
  content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px;
}
.dial-card.q1::after { background: var(--blue); }
.dial-card.q2::after { background: var(--red); }
.dial-card.q3::after { background: var(--gold); }
.dial-label {
  font-size: 10px; font-weight: 700; letter-spacing: 2px; margin-bottom: 9px;
}
.q1 .dial-label { color: var(--blue); }
.q2 .dial-label { color: var(--red); }
.q3 .dial-label { color: var(--gold); }
.dial-title { font-size: 16px; font-weight: 700; margin-bottom: 9px; }
.dial-desc  { font-size: 12px; color: var(--muted); line-height: 1.7; margin-bottom: 14px; }
.dial-item  {
  display: flex; gap: 8px; align-items: flex-start;
  font-size: 12px; color: var(--muted); line-height: 1.5; margin-bottom: 6px;
}
.dial-item::before { content: '→'; color: var(--gold); font-size: 11px; flex-shrink: 0; margin-top: 1px; }

/* ── OUTPUT / NOTIFICATION ── */
.output-grid {
  display: grid; grid-template-columns: 1fr 1.15fr;
  gap: 60px; align-items: center;
  width: 100%; max-width: 1100px;
}
.output-points { display: flex; flex-direction: column; gap: 16px; margin-top: 10px; }
.output-point  { display: flex; gap: 12px; align-items: flex-start; }
.pt-diamond    { color: var(--gold); flex-shrink: 0; margin-top: 3px; font-size: 10px; }
.pt-text       { font-size: 13px; color: var(--muted); line-height: 1.65; }

.notif-mock {
  background: #12141e; border: 1px solid rgba(255,255,255,0.08);
  border-radius: 16px; overflow: hidden;
  box-shadow: 0 28px 80px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.03);
}
.notif-bar {
  height: 3px;
  background: linear-gradient(90deg, #1a5276, var(--blue), var(--gold));
}
.notif-head {
  background: #0c1730; padding: 12px 15px;
  display: flex; align-items: center; gap: 10px;
  border-bottom: 1px solid rgba(255,255,255,0.06);
}
.notif-avatar {
  width: 32px; height: 32px; border-radius: 8px;
  background: linear-gradient(135deg, var(--gold), #a07840);
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; font-weight: 800; color: #000;
}
.notif-from { font-size: 13px; font-weight: 600; color: #fff; }
.notif-time { font-size: 10px; color: rgba(255,255,255,0.35); }
.notif-body {
  padding: 14px 15px;
  font-size: 11.5px; color: rgba(255,255,255,0.65); line-height: 1.8;
}
.nb { font-weight: 600; color: #fff; }
.ng { color: var(--gold-light); }
.nl { color: #5b9eff; text-decoration: underline; cursor: pointer; }
.nq {
  margin-top: 10px; padding: 9px 11px;
  background: rgba(200,169,110,0.1); border-left: 2px solid var(--gold);
  border-radius: 0 6px 6px 0;
  color: var(--gold-light); font-style: italic; font-size: 11px; line-height: 1.6;
}

/* ── BUSINESS ── */
.biz-grid {
  display: grid; grid-template-columns: repeat(2, 1fr);
  gap: 14px; margin-top: 12px;
}
.biz-card {
  background: var(--surface); border: 1px solid rgba(200,169,110,0.15);
  border-radius: var(--radius); padding: 20px 18px;
  display: flex; gap: 14px; align-items: flex-start;
  transition: border-color .2s;
}
.biz-card:hover { border-color: var(--gold); }
.biz-icon {
  width: 40px; height: 40px; flex-shrink: 0; border-radius: 10px;
  background: var(--gold-dim); color: var(--gold);
  display: flex; align-items: center; justify-content: center;
}
.biz-t { font-size: 14px; font-weight: 600; margin-bottom: 5px; }
.biz-d { font-size: 12px; color: var(--muted); line-height: 1.65; }

/* ── CLOSING ── */
.closing-wrap { text-align: center; max-width: 740px; }
.closing-icon {
  width: 80px; height: 80px; border-radius: 50%;
  background: radial-gradient(circle, var(--surface2), var(--surface));
  border: 1px solid var(--gold-border);
  display: flex; align-items: center; justify-content: center;
  margin: 0 auto 28px; color: var(--gold);
}
.closing-quote {
  font-size: clamp(18px, 2.6vw, 34px); font-weight: 300;
  line-height: 1.55; color: var(--white);
}
.closing-quote em { color: var(--gold); font-style: normal; font-weight: 700; }
.closing-tag {
  margin-top: 36px; font-size: 11px; color: var(--dimmer);
  letter-spacing: 3px; text-transform: uppercase;
}
</style>
</head>

// ═══════════════════════════════════════════════════════════════════════════
//  RENDERERS
// ═══════════════════════════════════════════════════════════════════════════
const R = {
  cover(d) {
    return `<div class="cover-grid">
      <div class="icon-hero">
        <div class="hero-circle">${SVG.brain(88)}</div>
      </div>
      <div>
        <div class="badge">${d.badge}</div>
        <h1 class="slide-title" style="white-space:pre-line">${d.title}</h1>
        <div class="divider"></div>
        <p class="slide-sub">${d.subtitle}</p>
        <p class="slide-desc" style="margin-top:6px;white-space:pre-line">${d.description}</p>
        <p class="cover-author">${d.author}</p>
      </div>
    </div>`;
  },

  'three-col'(d) {
    const cards = d.points.map(p => `
      <div class="card">
        <div class="card-icon">${SVG[p.icon]()}</div>
        <div class="card-title">${p.title}</div>
        <div class="card-desc">${p.desc}</div>
      </div>`).join('');
    return `<div class="wide">
      <div class="badge">${d.badge}</div>
      <h1 class="slide-title">${d.title}</h1>
      <p class="slide-sub">${d.subtitle}</p>
      <div class="three-col">${cards}</div>
    </div>`;
  },

  pipeline(d) {
    const steps = d.steps.map((s, i) => {
      const arrow = i < d.steps.length - 1
        ? `<div class="pipe-arrow">
             <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
               <line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/>
             </svg>
           </div>` : '';
      return `<div class="pipe-step">
        <div class="pipe-num">${s.num}</div>
        <div class="pipe-icon">${SVG[s.icon](26)}</div>
        <div class="pipe-title">${s.title}</div>
        <div class="pipe-desc">${s.desc}</div>
      </div>${arrow}`;
    }).join('');
    return `<div class="wide">
      <div class="badge">${d.badge}</div>
      <h1 class="slide-title">${d.title}</h1>
      <p class="slide-sub">${d.subtitle}</p>
      <div class="pipeline" style="margin-top:18px">${steps}</div>
    </div>`;
  },

  dialectic(d) {
    const cols = d.sections.map(s => {
      const items = s.items.map(i => `<div class="dial-item">${i}</div>`).join('');
      return `<div class="dial-card ${s.variant}">
        <div class="dial-label">${s.label}</div>
        <div class="dial-title">${s.title}</div>
        <div class="dial-desc">${s.desc}</div>
        <div>${items}</div>
      </div>`;
    }).join('');
    return `<div class="wide">
      <div class="badge">${d.badge}</div>
      <h1 class="slide-title">${d.title}</h1>
      <p class="slide-sub">${d.subtitle}</p>
      <div class="dialectic" style="margin-top:14px">${cols}</div>
    </div>`;
  },

  output(d) {
    const m = d.mockup;
    const pts = d.points.map(p => `
      <div class="output-point">
        <span class="pt-diamond">◆</span>
        <span class="pt-text">${p}</span>
      </div>`).join('');
    return `<div class="output-grid">
      <div>
        <div class="badge">${d.badge}</div>
        <h1 class="slide-title">${d.title}</h1>
        <div class="divider"></div>

      <div class="notif-mock">

            <div class="notif-from">생각 공장 Bot</div>
            <div class="notif-time">오늘 08:03 · Google Chat</div>
          </div>
        </div>
        <div class="notif-body">
          <span class="nb">${m.heading}</span> <span style="color:var(--muted)">(${m.date})</span>
          <br><br>
          <span class="ng">📚 오늘의 출처:</span><br>
          <span style="white-space:pre-line;font-size:10.5px;color:rgba(255,255,255,0.4)">${m.sources}</span>
          <br><br>
          <span class="ng">📝 생각의 정수:</span><br>
          <span style="white-space:pre-line;font-size:10.5px;color:rgba(255,255,255,0.5)">${m.preview}</span>
          <div class="nq">${m.q10}</div>
          <br>
          <span class="nl">🧠 제텔카스텐 전략실</span>&nbsp;&nbsp;<span class="nl">📄 오늘자 원문</span>
        </div>
      </div>
    </div>`;
  },

  business(d) {
    const cards = d.cards.map(c => `
      <div class="biz-card">
        <div class="biz-icon">${SVG[c.icon]()}</div>
        <div>
          <div class="biz-t">${c.title}</div>
          <div class="biz-d">${c.desc}</div>
        </div>
      </div>`).join('');
    return `<div class="wide">
      <div class="badge">${d.badge}</div>
      <h1 class="slide-title">${d.title}</h1>
      <p class="slide-sub">${d.subtitle}</p>
      <div class="biz-grid">${cards}</div>
    </div>`;
  },

  closing(d) {
    return `<div class="closing-wrap">
      <div class="closing-icon">${SVG.question(38)}</div>
      <div class="badge">${d.badge}</div>
      <div class="closing-quote">${d.quote}</div>
      <div class="closing-tag">${d.tag}</div>
    </div>`;
  },
};

// ═══════════════════════════════════════════════════════════════════════════
//  ENGINE
// ═══════════════════════════════════════════════════════════════════════════
let cur = 0;
const N = SLIDE_DATA.length;
const deck  = document.getElementById('deck');
const prog  = document.getElementById('progress');
const cnt   = document.getElementById('counter');
const dotsEl = document.getElementById('dots');

// Build slides
SLIDE_DATA.forEach((d, i) => {
  const el = document.createElement('div');
  el.className = 'slide';
  el.id = `s${i}`;
  el.innerHTML = R[d.type] ? R[d.type](d) : `<p>Slide ${d.id}</p>`;
  el.style.transform = i === 0 ? 'translateX(0)' : 'translateX(48px)';
  if (i === 0) { el.classList.add('active'); el.style.transform = 'translateX(0)'; }
  deck.appendChild(el);
});

// Build dots
SLIDE_DATA.forEach((_, i) => {
  const d = document.createElement('div');
  d.className = 'dot' + (i === 0 ? ' on' : '');
  d.addEventListener('click', () => go(i));
  dotsEl.appendChild(d);
});

function updateChrome() {
  prog.style.width = `${((cur + 1) / N) * 100}%`;
  cnt.textContent  = `${String(cur+1).padStart(2,'0')} / ${String(N).padStart(2,'0')}`;
  document.querySelectorAll('.dot').forEach((d,i) => d.classList.toggle('on', i === cur));
  document.getElementById('nav-prev').style.opacity = cur === 0 ? '0.3' : '1';
  document.getElementById('nav-next').style.opacity = cur === N-1 ? '0.3' : '1';
}

function go(idx) {
  if (idx < 0 || idx >= N || idx === cur) return;
  const forward = idx > cur;
  const fromEl  = document.getElementById(`s${cur}`);
  const toEl    = document.getElementById(`s${idx}`);

  // Exit current
  fromEl.style.transition = 'opacity .42s ease, transform .42s ease';
  fromEl.style.opacity    = '0';
  fromEl.style.transform  = forward ? 'translateX(-48px)' : 'translateX(48px)';
  fromEl.classList.remove('active');
  fromEl.style.pointerEvents = 'none';

  // Prepare incoming
  toEl.style.transition = 'none';
  toEl.style.opacity    = '0';
  toEl.style.transform  = forward ? 'translateX(48px)' : 'translateX(-48px)';
  toEl.classList.add('active');

  // Force reflow then animate in
  toEl.getBoundingClientRect();
  toEl.style.transition = 'opacity .42s ease, transform .42s ease';
  toEl.style.opacity    = '1';
  toEl.style.transform  = 'translateX(0)';

  setTimeout(() => {
    fromEl.style.transform = forward ? 'translateX(48px)' : 'translateX(-48px)';
  }, 460);

  cur = idx;
  updateChrome();
}

document.getElementById('nav-prev').addEventListener('click', () => go(cur - 1));
document.getElementById('nav-next').addEventListener('click', () => go(cur + 1));

document.addEventListener('keydown', e => {
  if (['ArrowRight','ArrowDown',' '].includes(e.key)) { e.preventDefault(); go(cur + 1); }
  if (['ArrowLeft','ArrowUp'].includes(e.key))        { e.preventDefault(); go(cur - 1); }
});

let tx = 0;
document.addEventListener('touchstart', e => tx = e.touches[0].clientX, { passive: true });
document.addEventListener('touchend',   e => {
  const d = tx - e.changedTouches[0].clientX;
  if (Math.abs(d) > 44) d > 0 ? go(cur+1) : go(cur-1);
}, { passive: true });

updateChrome();
</script>
